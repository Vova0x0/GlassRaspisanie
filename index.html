  <link rel="apple-touch-icon" href="https://sun9-84.userapi.com/s/v1/ig2/sIpw34X7TNgAeyM04lRXTy7egBdjjf1YI_1YgDxvv-9w6JzR7xPQ4B_o6RWsI5z9BgmTRw6uGbhhEUkdlrjQin-9.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0">

  <style>
    :root {
      --ios-green: #34C759;
      --ios-blue: #007AFF;
      --ios-purple: #5856D6;
      --ios-pink: #FF375F;
      --ios-orange: #FF9500;
      --ios-cyan: #32ADE6;
      
      --glass-bg-light: rgba(255, 255, 255, 0.08);
      --glass-bg-medium: rgba(255, 255, 255, 0.12);
      --glass-border-light: rgba(255, 255, 255, 0.15);
      --glass-border-medium: rgba(255, 255, 255, 0.25);
      
      --blur-medium: blur(40px);
      
      --shadow-medium: 0 20px 60px rgba(0, 0, 0, 0.3);
      --shadow-heavy: 0 40px 120px rgba(0, 0, 0, 0.4);
      
      --text-primary: rgba(255, 255, 255, 0.95);
      --text-secondary: rgba(255, 255, 255, 0.7);
      --text-tertiary: rgba(255, 255, 255, 0.45);
      
      --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-medium: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --transition-bounce: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      
      --card-radius: 24px;
      --sidebar-width: 260px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
    }
    
    html {
      background: #000;
      height: 100%;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background: radial-gradient(ellipse at 20% 20%, rgba(10, 132, 255, 0.15) 0%, transparent 40%),
                  radial-gradient(ellipse at 80% 80%, rgba(94, 92, 230, 0.15) 0%, transparent 40%),
                  linear-gradient(135deg, #000000 0%, #0A1A2F 30%, #1A0F2F 70%, #000000 100%);
      background-attachment: fixed;
      display: flex;
    }
    
    /* ================= САЙДБАР ================= */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--glass-bg-light);
      backdrop-filter: var(--blur-medium);
      border-right: 1px solid var(--glass-border-light);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 1000;
      padding: 20px 0;
    }
    
    .logo-section {
      padding: 20px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--glass-border-light);
    }
    
    .logo-img {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background-image: url('https://sun9-84.userapi.com/s/v1/ig2/sIpw34X7TNgAeyM04lRXTy7egBdjjf1YI_1YgDxvv-9w6JzR7xPQ4B_o6RWsI5z9BgmTRw6uGbhhEUkdlrjQin-9.jpg?quality=95&as=32x32,48x48,72x72,108x108,160x160,240x240,360x360,480x480,540x540,640x640,720x720,1024x1024&from=bu&cs=1024x0');
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
    }
    
    .logo-text {
      font-weight: 700;
      font-size: 15px;
      color: var(--text-primary);
      line-height: 1.2;
    }
    
    .nav-section {
      flex: 1;
      padding: 20px 12px;
      overflow-y: auto;
    }
    
    .nav-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-tertiary);
      padding: 0 12px 12px;
      font-weight: 600;
    }
    
    .nav-list {
      list-style: none;
    }
    
    .nav-item {
      margin-bottom: 4px;
    }
    
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      text-decoration: none;
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 14px;
      border-radius: 12px;
      transition: var(--transition-fast);
    }
    
    .nav-link:hover {
      background: var(--glass-bg-medium);
      color: var(--text-primary);
    }
    
    .nav-link.active {
      background: linear-gradient(135deg, var(--ios-green), var(--ios-cyan));
      color: white;
      box-shadow: 0 4px 15px rgba(52, 199, 89, 0.3);
    }
    
    .nav-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
    }
    
    /* ================= ОСНОВНОЙ КОНТЕНТ ================= */
    .main-content {
      flex: 1;
      margin-left: var(--sidebar-width);
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    
    .topbar {
      background: var(--glass-bg-light);
      backdrop-filter: var(--blur-medium);
      border-bottom: 1px solid var(--glass-border-light);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 900;
      min-height: 72px;
    }
    
    .page-title {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
    }
    
    .search-container {
      position: relative;
      width: 300px;
    }
    
    .search-input {
      width: 100%;
      padding: 12px 16px 12px 42px;
      border: 1px solid var(--glass-border-light);
      border-radius: 14px;
      background: var(--glass-bg-light);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: var(--transition-fast);
    }
    
    .search-input:focus {
      outline: none;
      border-color: var(--ios-green);
      background: var(--glass-bg-medium);
    }
    
    .search-input::placeholder {
      color: var(--text-tertiary);
    }
    
    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 16px;
    }
    
    .page-content {
      padding: 32px;
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
    }
    
    .group-search-box {
      position: relative;
      margin-bottom: 20px;
    }
    
    .group-search-input {
      width: 100%;
      padding: 16px 20px 16px 52px;
      border: 1px solid var(--glass-border-light);
      border-radius: 16px;
      background: var(--glass-bg-light);
      color: var(--text-primary);
      font-size: 15px;
      font-family: inherit;
      transition: var(--transition-fast);
    }
    
    .group-search-input:focus {
      outline: none;
      border-color: var(--ios-green);
      background: var(--glass-bg-medium);
    }
    
    .group-search-input::placeholder {
      color: var(--text-tertiary);
    }
    
    .group-search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-tertiary);
      font-size: 18px;
    }
    
    /* ================= КНОПКА РЕЗЕРВНОГО РАСПИСАНИЯ ================= */
    .missing-group-btn {
      width: 100%;
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--ios-green), #2E7D32);
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition-bounce);
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(52, 199, 89, 0.35);
    }
    
    .missing-group-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(52, 199, 89, 0.5);
    }
    
    .missing-group-btn:active {
      transform: scale(0.98);
    }
    
    /* ================= СПИСОК ГРУПП ================= */
    .groups-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .group-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      background: var(--glass-bg-light);
      backdrop-filter: var(--blur-medium);
      border: 1px solid var(--glass-border-light);
      border-radius: 18px;
      cursor: pointer;
      transition: var(--transition-fast);
    }
    
    .group-item:hover {
      background: var(--glass-bg-medium);
      border-color: var(--glass-border-medium);
      transform: translateX(4px);
      box-shadow: var(--shadow-medium);
    }
    
    .group-item:active {
      transform: scale(0.99);
    }
    
    .group-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(52, 199, 89, 0.2), rgba(50, 173, 230, 0.2));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ios-green);
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .group-name {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .group-status {
      color: var(--ios-green);
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .group-arrow {
      color: var(--text-tertiary);
      font-size: 16px;
      flex-shrink: 0;
    }
    
    /* ================= ФУТЕР С КНОПКОЙ ТЕМЫ ================= */
    .footer {
      text-align: center;
      padding: 30px 20px;
      color: var(--text-tertiary);
      font-size: 0.9rem;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      border-top: 1px solid var(--glass-border-light);
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }
    
    .footer-content {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .footer-signature {
      font-weight: 800;
      color: var(--text-secondary);
      margin-top: 8px;
      font-size: 1rem;
    }
    
    .theme-section {
      margin-top: 10px;
    }
    
    .theme-button {
      padding: 16px 28px;
      border: 1px solid rgba(52, 199, 89, 0.4);
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(52, 199, 89, 0.3), rgba(50, 173, 230, 0.3));
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: var(--transition-bounce);
      box-shadow: 0 8px 32px rgba(52, 199, 89, 0.2);
      animation: themeButtonPulse 3s ease-in-out infinite;
    }
    
    .theme-button:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 48px rgba(52, 199, 89, 0.5);
      border-color: rgba(52, 199, 89, 0.6);
    }
    
    .theme-button:active {
      transform: scale(0.98);
    }
    
    @keyframes themeButtonPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(52, 199, 89, 0.2); }
      50% { box-shadow: 0 12px 40px rgba(52, 199, 89, 0.4); }
    }
    
    /* ================= ПРАЗДНИЧНЫЕ БАННЕРЫ ================= */
    .welcome-banner {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      background: linear-gradient(135deg, rgba(94, 92, 230, 0.3), rgba(10, 132, 255, 0.3));
      backdrop-filter: var(--blur-medium);
      border: 1px solid var(--glass-border-medium);
      border-radius: 20px;
      padding: 14px 28px;
      box-shadow: var(--shadow-medium);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .welcome-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .welcome-icon {
      font-size: 1.4rem;
      color: var(--ios-purple);
      animation: wave 2s ease-in-out infinite;
    }
    
    @keyframes wave {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-15deg); }
    }
    
    .welcome-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
    }
    
    .sep1-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9998;
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.25), rgba(255, 165, 0, 0.25), rgba(50, 205, 50, 0.25));
      backdrop-filter: var(--blur-medium);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 20px 60px rgba(255, 215, 0, 0.3), 0 0 40px rgba(50, 205, 50, 0.2);
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .sep1-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .sep1-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .sep1-icon {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #32CD32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: bellRing 2s ease-in-out infinite;
    }
    
    @keyframes bellRing {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.1); }
      75% { transform: rotate(10deg) scale(1.1); }
    }
    
    .sep1-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 50%, #32CD32 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .feb23-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9998;
      background: linear-gradient(135deg, rgba(0, 82, 165, 0.25), rgba(200, 16, 46, 0.25));
      backdrop-filter: var(--blur-medium);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 20px 60px rgba(0, 82, 165, 0.3), 0 0 40px rgba(200, 16, 46, 0.2);
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .feb23-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .feb23-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .feb23-icon {
      font-size: 1.8rem;
      color: #0052A5;
      animation: salute 2s ease-in-out infinite;
    }
    
    @keyframes salute {
      0%, 100% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-10deg) scale(1.1); }
      75% { transform: rotate(10deg) scale(1.1); }
    }
    
    .feb23-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0052A5 0%, #C8102E 50%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .newyear-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9998;
      background: linear-gradient(135deg, rgba(29, 185, 84, 0.25), rgba(220, 53, 69, 0.25), rgba(255, 193, 7, 0.25));
      backdrop-filter: var(--blur-medium);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 20px 60px rgba(29, 185, 84, 0.3), 0 0 40px rgba(220, 53, 69, 0.2);
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .newyear-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .newyear-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .newyear-icon {
      font-size: 1.8rem;
      color: #1DB954;
      animation: sparkle 1.5s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { transform: scale(1) rotate(0deg); filter: brightness(1); }
      50% { transform: scale(1.2) rotate(180deg); filter: brightness(1.5); }
    }
    
    .newyear-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #1DB954 0%, #DC3545 33%, #FFC107 66%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .flagday-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9998;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(0, 57, 166, 0.25), rgba(213, 43, 30, 0.25));
      backdrop-filter: var(--blur-medium);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 20px 60px rgba(0, 57, 166, 0.3);
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .flagday-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .flagday-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .flagday-icon {
      font-size: 1.8rem;
      background: linear-gradient(135deg, #FFFFFF 33%, #0039A6 66%, #D52B1E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: waveFlag 2s ease-in-out infinite;
    }
    
    @keyframes waveFlag {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-5deg); }
      75% { transform: rotate(5deg); }
    }
    
    .flagday-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FFFFFF 0%, #0039A6 50%, #D52B1E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .march8-banner {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      z-index: 9998;
      background: linear-gradient(135deg, rgba(255, 55, 95, 0.3), rgba(255, 105, 180, 0.3), rgba(255, 182, 193, 0.3));
      backdrop-filter: var(--blur-medium);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 20px;
      padding: 18px 28px;
      box-shadow: 0 20px 60px rgba(255, 105, 180, 0.4), 0 0 40px rgba(255, 182, 193, 0.3);
      display: flex;
      align-items: center;
      gap: 15px;
      opacity: 0;
      transition: all 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    
    .march8-banner.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    
    .march8-banner.hiding {
      opacity: 0;
      transform: translateX(-50%) translateY(-100px);
      pointer-events: none;
    }
    
    .march8-icon {
      font-size: 1.8rem;
      color: #FF69B4;
      animation: float 2s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-5px) rotate(5deg); }
      66% { transform: translateY(3px) rotate(-5deg); }
    }
    
    .march8-text {
      font-size: 1.3rem;
      font-weight: 800;
      background: linear-gradient(135deg, #FF69B4 0%, #FFB6C1 50%, #FFFFFF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .leaves, .snowflakes, .petals {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 9996;
      overflow: hidden;
    }
    
    .leaf {
      position: absolute;
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #FFD700, #32CD32);
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
      opacity: 0;
      animation: leafFall 10s linear infinite;
    }
    
    @keyframes leafFall {
      0% { opacity: 0; transform: translateY(-100px) rotate(0deg); }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
    }
    
    .snowflake {
      position: absolute;
      width: 12px;
      height: 12px;
      background: white;
      border-radius: 50%;
      filter: blur(1px);
      opacity: 0;
      animation: snowFall 8s linear infinite;
    }
    
    @keyframes snowFall {
      0% { opacity: 0; transform: translateY(-100px) rotate(0deg); }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(100vh) rotate(360deg); }
    }
    
    .petal {
      position: absolute;
      width: 15px;
      height: 15px;
      background: linear-gradient(135deg, #FF69B4, #FFB6C1);
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0;
      animation: petalFall 8s linear infinite;
    }
    
    @keyframes petalFall {
      0% { opacity: 0; transform: translateY(-100px) rotate(0deg); }
      10% { opacity: 0.8; }
      90% { opacity: 0.8; }
      100% { opacity: 0; transform: translateY(100vh) rotate(720deg); }
    }
    
    .mobile-menu-btn {
      display: none;
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--glass-bg-light);
      border: 1px solid var(--glass-border-light);
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 18px;
      flex-shrink: 0;
    }
    
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: var(--transition-medium);
      backdrop-filter: blur(4px);
    }
    
    @media (max-width: 1024px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform var(--transition-medium);
      }
      .sidebar.active {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
      .mobile-menu-btn {
        display: flex;
      }
      .overlay.active {
        opacity: 1;
        visibility: visible;
      }
    }
    
    @media (max-width: 768px) {
      .topbar {
        padding: 12px 16px;
      }
      .page-content {
        padding: 20px 16px;
      }
      .search-container {
        display: none;
      }
      .page-title {
        font-size: 18px;
      }
      .group-item {
        padding: 14px 16px;
      }
      .group-icon {
        width: 40px;
        height: 40px;
        font-size: 16px;
      }
      .group-name {
        font-size: 15px;
      }
    }
    
    @media (max-width: 480px) {
      .welcome-banner {
        flex-direction: column;
        text-align: center;
        gap: 8px;
        padding: 12px 20px;
      }
      .sep1-banner, .feb23-banner, .newyear-banner, .flagday-banner, .march8-banner {
        flex-direction: column;
        text-align: center;
        gap: 10px;
        padding: 16px 20px;
      }
      .sep1-text, .feb23-text, .newyear-text, .flagday-text, .march8-text {
        font-size: 1.1rem;
      }
      .page-content {
        padding: 16px 12px;
      }
      .group-search-input {
        padding: 14px 16px 14px 44px;
        font-size: 14px;
      }
      .group-search-icon {
        left: 16px;
        font-size: 16px;
      }
      .missing-group-btn {
        padding: 14px 20px;
        font-size: 14px;
      }
      .theme-button {
        padding: 14px 22px;
        font-size: 0.95rem;
      }
    }
    
    @supports (padding: max(0px)) {
      .topbar {
        padding-left: max(16px, env(safe-area-inset-left));
        padding-right: max(16px, env(safe-area-inset-right));
      }
    }
  </style>
</head>
<body>

  <!-- Праздничные баннеры -->
  <div class="welcome-banner" id="welcomeBanner">
    <i class="fas fa-hand-sparkles welcome-icon"></i>
    <span class="welcome-text">Привет</span>
  </div>
  
  <div class="sep1-banner" id="sep1Banner">
    <i class="fas fa-bell sep1-icon"></i>
    <span class="sep1-text">С 1 сентября! 🎓📚</span>
  </div>
  
  <div class="feb23-banner" id="feb23Banner">
    <i class="fas fa-shield-alt feb23-icon"></i>
    <span class="feb23-text">С Днём защитника Отечества! 🇷🇺</span>
  </div>
  
  <div class="newyear-banner" id="newyearBanner">
    <i class="fas fa-tree newyear-icon"></i>
    <span class="newyear-text">С Новым годом! 🎄✨</span>
  </div>
  
  <div class="flagday-banner" id="flagdayBanner">
    <i class="fas fa-flag flagday-icon"></i>
    <span class="flagday-text">С Днём Российского флага! 🇷🇺</span>
  </div>
  
  <div class="march8-banner" id="march8Banner">
    <i class="fas fa-heart march8-icon"></i>
    <span class="march8-text">С 8 марта! 💐</span>
  </div>
  
  <!-- Эффекты -->
  <div class="leaves" id="leavesContainer"></div>
  <div class="snowflakes" id="snowflakesContainer"></div>
  <div class="petals" id="petalsContainer"></div>
  
  <div class="overlay" id="overlay"></div>

  <!-- Сайдбар -->
  <aside class="sidebar" id="sidebar">
    <div class="logo-section">
      <div class="logo-img"></div>
      <div class="logo-text">Стеклянное расписание</div>
    </div>
    
    <nav class="nav-section">
      <div class="nav-title">Основное</div>
      <ul class="nav-list">
        <li class="nav-item">
          <a href="#" class="nav-link active" data-page="schedule">
            <i class="nav-icon fas fa-search"></i>
            <span>Расписание</span>
          </a>
        </li>
        <li class="nav-item">
          <a href="Ads.html" class="nav-link" data-page="ads">
            <i class="nav-icon fas fa-ad"></i>
            <span>Реклама</span>
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Основной контент -->
  <main class="main-content">
    <header class="topbar">
      <div style="display: flex; align-items: center; gap: 16px;">
        <button class="mobile-menu-btn" id="mobile-menu-btn">
          <i class="fas fa-bars"></i>
        </button>
        <h1 class="page-title">Расписание</h1>
      </div>
      
      <div class="search-container">

              </div>
    </header>

    <div class="page-content">
      <div class="group-search-box">
        <i class="group-search-icon fas fa-search"></i>
        <input type="text" class="group-search-input" placeholder="Введите группу для поиска..." id="groupSearchInput">
      </div>
      
      <!-- Кнопка резервного расписания — зелёная, без иконки -->
      <button class="missing-group-btn" id="missingGroupBtn">
        <span>GlassRaspisanie — это независимая платформа, которая поддерживает Ksktop.ru и создаёт резервное расписание для групп на случай возникновения проблем с Ksktop. Также на платформе ведётся основной список, определяющий, для каких групп создавать расписание, а для каких — нет.</span>
      </button>
      
      <div class="groups-list" id="groupsList"></div>
    </div>

    <!-- Футер с кнопкой переключения темы -->
    <footer class="footer">
      <div class="footer-content">
        <p>© 2026 Расписание занятий • Ремастер Glass version</p>
        <p class="footer-signature">by Vova0x0</p>
      </div>
      
      <div class="theme-section">
        <button class="theme-button" id="themeSwitchBtn">
          <i class="fas fa-leaf"></i>
          <span>Перейти на зелёную тему</span>
        </button>
      </div>
    </footer>
  </main>

  <script>
    // ================= ДАННЫЕ ГРУПП =================
    const groups = [
      { name: "КСК.9-25-2", status: true, url: "Ksk9-25-2.html" },
      { name: "Самодурова Д. А.", status: true, url: "Samodurova.html" },
      { name: "Люба(Временно не поддерживается)", status: true, url: "https://vova0x0.github.io/RaspisanieforLuba/" },
      { name: "ГНХ.9-25-1", status: true, url: "Gnh9-25-1.html" },
      { name: "ГНХ.9-26-1", status: true, url: "Gnh9-26-1.html" },
      { name: "ГНХ.9-26-2", status: true, url: "Gnh9-26-2.html" },
      { name: "ДСА.9-23-2", status: true, url: "Dsa9-23-2.html" },
      { name: "ДСА.9-24-2", status: true, url: "Dsa9-24-2.html" },
      { name: "ЗУ.11-26-1", status: true, url: "Su11-26-1.html" },
      { name: "ЗУС.9-25-1", status: true, url: "Sus9-25-1.html" },
      { name: "ЗУС.11-25-1", status: true, url: "Sus11-25-1.html" },
      { name: "КСК.9-24-1", status: true, url: "Ksk9-24-1.html" },
      { name: "КСК.9-26-1", status: true, url: "Ksk9-26-1.html" },
      { name: "С.11-25-2", status: true, url: "S11-25-2.html" },
      { name: "С.11-26-1", status: true, url: "S11-26-1.html" },
      { name: "СДМ.9-24-2", status: true, url: "Sdm9-24-2.html" },
      { name: "СДМ.9-25-1", status: true, url: "Sdm9-25-1.html" },
      { name: "СДМ.9-25-2", status: true, url: "Sdm9-25-2.html" },
      { name: "СЭАДАиГПС.9-24-1", status: true, url: "Seada9-24-1.html" },
      { name: "СЭАДАиГПС.9-25-1", status: true, url: "Seada9-25-1.html" },
      { name: "СЭАДАиГПС.9-25-2", status: true, url: "Seada9-25-2.html" },
      { name: "СЭАДАиГПС.9-26-1", status: true, url: "Seada9-26-1.html" },
      { name: "ТОРА.9-25-1", status: true, url: "Tora9-25-1.html" },
      { name: "ТОРА.11-26-1", status: true, url: "Tora11-26-1.html" }
    ];

    // ================= ПРАЗДНИКИ =================
    function createLeaves() {
      const container = document.getElementById('leavesContainer');
      container.innerHTML = '';
      for (let i = 0; i < 50; i++) {
        const leaf = document.createElement('div');
        leaf.className = 'leaf';
        leaf.style.left = `${Math.random() * 100}%`;
        leaf.style.animationDelay = `${Math.random() * 5}s`;
        leaf.style.animationDuration = `${8 + Math.random() * 8}s`;
        leaf.style.opacity = `${0.5 + Math.random() * 0.3}`;
        container.appendChild(leaf);
      }
    }

    function createSnowflakes() {
      const container = document.getElementById('snowflakesContainer');
      container.innerHTML = '';
      for (let i = 0; i < 80; i++) {
        const snowflake = document.createElement('div');
        snowflake.className = 'snowflake';
        snowflake.style.left = `${Math.random() * 100}%`;
        snowflake.style.animationDelay = `${Math.random() * 5}s`;
        snowflake.style.animationDuration = `${6 + Math.random() * 6}s`;
        snowflake.style.opacity = `${0.5 + Math.random() * 0.3}`;
        snowflake.style.width = `${5 + Math.random() * 10}px`;
        snowflake.style.height = snowflake.style.width;
        container.appendChild(snowflake);
      }
    }

    function createPetals() {
      const container = document.getElementById('petalsContainer');
      container.innerHTML = '';
      for (let i = 0; i < 60; i++) {
        const petal = document.createElement('div');
        petal.className = 'petal';
        petal.style.left = `${Math.random() * 100}%`;
        petal.style.animationDelay = `${Math.random() * 5}s`;
        petal.style.animationDuration = `${6 + Math.random() * 4}s`;
        petal.style.opacity = `${0.4 + Math.random() * 0.4}`;
        container.appendChild(petal);
      }
    }

    function checkHolidays() {
      const today = new Date();
      const month = today.getMonth();
      const date = today.getDate();
      
      const isSep1 = month === 8 && date === 1;
      const isFeb23 = month === 1 && date === 23;
      const isNewYear = (month === 11 && date === 31) || (month === 0 && date >= 1 && date <= 7);
      const isFlagDay = month === 7 && date === 22;
      const isMarch8 = month === 2 && date === 8;
      
      if (isSep1) {
        document.getElementById('sep1Banner').classList.add('show');
        createLeaves();
        document.body.style.background = `radial-gradient(ellipse at 20% 20%, rgba(255, 215, 0, 0.25) 0%, transparent 40%), radial-gradient(ellipse at 80% 80%, rgba(50, 205, 50, 0.25) 0%, transparent 40%), linear-gradient(135deg, #1A2A0A 0%, #2A1A0F 30%, #0F2A1A 70%, #000000 100%)`;
      } else {
        document.getElementById('sep1Banner').style.display = 'none';
      }
      
      if (isFeb23) {
        document.getElementById('feb23Banner').classList.add('show');
        document.body.style.background = `radial-gradient(ellipse at 20% 20%, rgba(0, 82, 165, 0.25) 0%, transparent 40%), radial-gradient(ellipse at 80% 80%, rgba(200, 16, 46, 0.25) 0%, transparent 40%), linear-gradient(135deg, #0A0A2A 0%, #1A0A1F 30%, #0A1A2F 70%, #000000 100%)`;
      } else {
        document.getElementById('feb23Banner').style.display = 'none';
      }
      
      if (isNewYear) {
        document.getElementById('newyearBanner').classList.add('show');
        createSnowflakes();
        document.body.style.background = `radial-gradient(ellipse at 20% 20%, rgba(29, 185, 84, 0.25) 0%, transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(220, 53, 69, 0.2) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(255, 193, 7, 0.25) 0%, transparent 40%), linear-gradient(135deg, #0A2A1A 0%, #1A0F2F 30%, #2F0A1A 70%, #000000 100%)`;
      } else {
        document.getElementById('newyearBanner').style.display = 'none';
      }
      
      if (isFlagDay) {
        document.getElementById('flagdayBanner').classList.add('show');
        document.body.style.background = `radial-gradient(ellipse at 20% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 40%), radial-gradient(ellipse at 50% 50%, rgba(0, 57, 166, 0.2) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(213, 43, 30, 0.15) 0%, transparent 40%), linear-gradient(135deg, #000033 0%, #0A1A2F 30%, #2F0A0A 70%, #000000 100%)`;
      } else {
        document.getElementById('flagdayBanner').style.display = 'none';
      }
      
      if (isMarch8) {
        document.getElementById('march8Banner').classList.add('show');
        createPetals();
        document.body.style.background = `radial-gradient(ellipse at 20% 20%, rgba(255, 105, 180, 0.25) 0%, transparent 40%), radial-gradient(ellipse at 80% 80%, rgba(255, 182, 193, 0.25) 0%, transparent 40%), linear-gradient(135deg, #1A0A14 0%, #2F0A1A 30%, #1A0F2F 70%, #000000 100%)`;
      } else {
        document.getElementById('march8Banner').style.display = 'none';
      }
    }

    // ================= ПЕРЕХОД НА ЗЕЛЁНУЮ ТЕМУ =================
    const GREEN_THEME_URL = "https://ksktop.ru/";
    
    function switchToGreenTheme() {
      const themeBtn = document.getElementById('themeSwitchBtn');
      themeBtn.style.transform = 'scale(0.95)';
      
      // Создаем эффект перехода
      const transitionOverlay = document.createElement('div');
      transitionOverlay.style.position = 'fixed';
      transitionOverlay.style.top = '0';
      transitionOverlay.style.left = '0';
      transitionOverlay.style.width = '100%';
      transitionOverlay.style.height = '100%';
      transitionOverlay.style.background = 'linear-gradient(135deg, #34C759, #32ADE6)';
      transitionOverlay.style.zIndex = '99999';
      transitionOverlay.style.opacity = '0';
      transitionOverlay.style.transition = 'opacity 0.6s ease';
      document.body.appendChild(transitionOverlay);
      
      setTimeout(() => {
        transitionOverlay.style.opacity = '1';
      }, 10);
      
      // Сообщение о переходе
      const message = document.createElement('div');
      message.style.position = 'fixed';
      message.style.top = '50%';
      message.style.left = '50%';
      message.style.transform = 'translate(-50%, -50%)';
      message.style.zIndex = '100000';
      message.style.color = 'white';
      message.style.fontSize = '1.4rem';
      message.style.fontWeight = '600';
      message.style.textAlign = 'center';
      message.style.opacity = '0';
      message.style.transition = 'opacity 0.5s ease';
      message.innerHTML = `
        <i class="fas fa-leaf" style="font-size: 3rem; margin-bottom: 15px; display: block;"></i>
        <div>Переход на зелёную тему...</div>
      `;
      document.body.appendChild(message);
      
      setTimeout(() => {
        message.style.opacity = '1';
      }, 300);
      
      // Переход через 2 секунды
      setTimeout(() => {
        window.location.href = GREEN_THEME_URL;
        
        setTimeout(() => {
          themeBtn.style.transform = '';
          transitionOverlay.style.opacity = '0';
          message.style.opacity = '0';
          
          setTimeout(() => {
            if (transitionOverlay.parentNode) transitionOverlay.remove();
            if (message.parentNode) message.remove();
          }, 600);
        }, 500);
      }, 2000);
    }

    // ================= РЕНДЕР ГРУПП =================
    function renderGroups(filter = '') {
      const list = document.getElementById('groupsList');
      const filtered = groups.filter(g => g.name.toLowerCase().includes(filter.toLowerCase()));
      
      if (filtered.length === 0) {
        list.innerHTML = `
          <div style="text-align: center; padding: 40px 20px; color: var(--text-tertiary);">
            <i class="fas fa-search" style="font-size: 2.5rem; margin-bottom: 16px; display: block; opacity: 0.5;"></i>
            <p>Группы не найдены</p>
          </div>
        `;
        return;
      }
      
      list.innerHTML = filtered.map(group => `
        <div class="group-item" data-group="${group.name}" data-url="${group.url}">
          <div class="group-icon">
            <i class="fas fa-users"></i>
          </div>
          <span class="group-name">${group.name}</span>
          ${group.status ? '<i class="fas fa-check-circle group-status"></i>' : ''}
          <i class="fas fa-chevron-right group-arrow"></i>
        </div>
      `).join('');
      
      document.querySelectorAll('.group-item').forEach(item => {
        item.addEventListener('click', function() {
          const url = this.dataset.url;
          this.style.transform = 'scale(0.98)';
          setTimeout(() => {
            this.style.transform = '';
            window.location.href = url;
          }, 150);
        });
      });
    }

    // ================= ИНИЦИАЛИЗАЦИЯ =================
    document.addEventListener('DOMContentLoaded', function() {
      checkHolidays();
      
      setTimeout(() => {
        const banner = document.getElementById('welcomeBanner');
        if (banner) banner.classList.add('hiding');
      }, 4000);
      
      renderGroups();
      
      const searchInput = document.getElementById('groupSearchInput');
      searchInput.addEventListener('input', function() {
        renderGroups(this.value);
      });
      
      document.getElementById('missingGroupBtn').addEventListener('click', function() {
        this.style.transform = 'scale(0.98)';
        setTimeout(() => this.style.transform = '', 150);
      });
      
      // Кнопка перехода на зеленую тему
      document.getElementById('themeSwitchBtn').addEventListener('click', switchToGreenTheme);
      
      // Мобильное меню
      const mobileMenuBtn = document.getElementById('mobile-menu-btn');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      
      mobileMenuBtn.addEventListener('click', () => {
        sidebar.classList.toggle('active');
        overlay.classList.toggle('active');
        document.body.style.overflow = sidebar.classList.contains('active') ? 'hidden' : '';
      });
      
      overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      });
      
      // Навигация по сайдбару
      document.querySelectorAll('.nav-link').forEach(link => {
        link.addEventListener('click', function(e) {
          const href = this.getAttribute('href');
          const page = this.getAttribute('data-page');
          
          // Если ссылка ведёт на другую страницу (не "#") — даём браузеру перейти
          if (href && href !== '#') {
            // Закрываем мобильное меню перед переходом
            if (window.innerWidth <= 1024) {
              sidebar.classList.remove('active');
              overlay.classList.remove('active');
              document.body.style.overflow = '';
            }
            return; // не вызываем preventDefault — браузер сам перейдёт по ссылке
          }
          
          // Иначе — просто переключаем активный пункт (как было)
          e.preventDefault();
          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
          this.classList.add('active');
          
          if (window.innerWidth <= 1024) {
            sidebar.classList.remove('active');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
          }
        });
      });
    });
  </script>
</body>
